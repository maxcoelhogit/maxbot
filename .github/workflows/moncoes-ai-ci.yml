name: Moncoes AI CI

on:
  push:
    paths:
      - "moncoes-ai-monitor/**"
      - "moncoes-alertas-pwa/**"
      - ".github/workflows/moncoes-ai-ci.yml"
  pull_request:
    paths:
      - "moncoes-ai-monitor/**"
      - "moncoes-alertas-pwa/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install monitor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r moncoes-ai-monitor/requirements.txt
      - name: Compile Python
        run: |
          python -m py_compile moncoes-ai-monitor/app/*.py
          python -m py_compile moncoes-alertas-pwa/app.py
          python -m py_compile moncoes-alertas-pwa/install_vm.py
          python -m py_compile moncoes-alertas-pwa/portalctl.py
      - name: Validate JSON
        run: |
          python -m json.tool moncoes-ai-monitor/config/cameras.json >/dev/null
          python -m json.tool moncoes-ai-monitor/config/rules.json >/dev/null
          python -m json.tool moncoes-alertas-pwa/static/manifest.webmanifest >/dev/null
      - name: Validate shell syntax
        run: |
          bash -n moncoes-ai-monitor/install.sh
          bash -n moncoes-ai-monitor/update.sh
      - name: Validate JavaScript
        run: node --check moncoes-alertas-pwa/static/app.js
