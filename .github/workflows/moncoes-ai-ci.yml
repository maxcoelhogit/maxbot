name: Moncoes AI CI

on:
  push:
    paths:
      - "moncoes-ai-monitor/**"
      - ".github/workflows/moncoes-ai-ci.yml"
  pull_request:
    paths:
      - "moncoes-ai-monitor/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r moncoes-ai-monitor/requirements.txt
      - name: Compile Python
        run: |
          python -m py_compile moncoes-ai-monitor/app/*.py
      - name: Validate JSON
        run: |
          python -m json.tool moncoes-ai-monitor/config/cameras.json >/dev/null
          python -m json.tool moncoes-ai-monitor/config/rules.json >/dev/null
      - name: Validate shell syntax
        run: |
          bash -n moncoes-ai-monitor/install.sh
